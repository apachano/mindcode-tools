name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump to apply before publish
        required: true
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major
  push:
    tags:
      - v*

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate
        run: npm run package

      - name: Publish from existing version
        if: github.event_name == 'push' || inputs.version_bump == 'none'
        run: npx @vscode/vsce publish -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Bump version and publish
        if: github.event_name == 'workflow_dispatch' && inputs.version_bump != 'none'
        run: npx @vscode/vsce publish ${{ inputs.version_bump }} -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
